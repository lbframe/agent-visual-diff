name: Bug report
description: Report incorrect or unexpected behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve agent-visual-diff.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.12.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Include the exact avd command when possible.
      render: shell
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Attach or link sanitized PNGs if they are needed to reproduce the issue.
